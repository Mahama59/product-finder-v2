<header class="hero">

<div class="card">

<h2>🔍 Search Products</h2>

<input
id="searchInput"
placeholder="Search products..."
onkeyup="searchProducts()">

<select
id="categoryFilter"
onchange="searchProducts()">

<option value="">All Categories</option>

<option value="Electronics">Electronics</option>

<option value="Fashion">Fashion</option>

<option value="Home">Home & Living</option>

<option value="Sports">Sports</option>

</select>

</div>

<h1>🛒 Marketplace</h1>

<p>Find products from trusted sellers</p>

</header>

<div
class="product-grid"
id="marketplaceProducts">

<p>Testing marketplace...</p>

</div>

<script src="../js/cart.js"></script>
<script src="../js/chat.js"></script>
<script src="../js/products.js"></script>
<script src="../js/main.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const box =
        document.getElementById("marketplaceProducts");

    if (!box) {
        return;
    }

    // Check whether products.js loaded correctly
    if (typeof loadMarketplaceProducts !== "function") {

        box.innerHTML = `
            <div class="product">
                <h3>❌ Marketplace JavaScript did not load</h3>
                <p>products.js is not available on this page.</p>
            </div>
        `;

        return;
    }

    // Run the normal marketplace loader
    loadMarketplaceProducts();

});
</script>

</body>
