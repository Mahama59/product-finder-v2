<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - Product Finder</title>

    <link rel="stylesheet"
          href="../style.css">

</head>

<body onload="loadCheckout()">

<nav>

    <h2>🛍 Product Finder</h2>

    <a href="cart.html">
        ← Cart
    </a>

</nav>

<header class="hero">

    <h1>
        💳 Checkout
    </h1>

</header>

<div class="card">

    <h2>
        Customer Details
    </h2>

    <input
        id="customerName"
        type="text"
        placeholder="Full Name"
    >

    <br><br>

    <input
        id="customerEmail"
        type="email"
        placeholder="Email"
    >

    <br><br>

    <input
        id="customerPhone"
        type="tel"
        placeholder="Phone Number"
    >

    <br><br>

    <input
        id="customerAddress"
        type="text"
        placeholder="Delivery Address"
    >

    <br><br>

    <input
        id="customerCity"
        type="text"
        placeholder="City"
    >

    <br><br>

    <h2>
        Order Summary
    </h2>

    <div id="checkoutItems">
        <p>Loading order...</p>
    </div>

    <h2>
        Total:
        $<span id="checkoutTotal">0.00</span>
    </h2>

    <h2>
        💳 Payment Method
    </h2>

    <label>

        <input
            type="radio"
            name="paymentMethod"
            value="Paystack"
            checked
        >

        Paystack (Card / Mobile Money)

    </label>

    <br><br>

    <label>

        <input
            type="radio"
            name="paymentMethod"
            value="Cash on Delivery"
        >

        Cash on Delivery

    </label>

    <br><br>

    <button onclick="placeOrder()">
        ✅ Place Order
    </button>

</div>

<script src="https://js.paystack.co/v1/inline.js"></script>

<script src="../js/notifications.js?v=2"></script>
<script src="../js/order.js?v=2"></script>

</body>

</html>
